services:
  postgres:
    image: postgres:16
    container_name: webform-postgres
    environment:
      POSTGRES_USER: webform
      POSTGRES_PASSWORD: webform
      POSTGRES_DB: webform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webform -d webform"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10
    container_name: webform-nats
    command:
      - "-js"
      - "-sd"
      - "/data"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  api:
    build: .
    image: webform-builder:latest
    container_name: webform-api
    command: ["./api"]
    environment:
      DATABASE_URL: postgres://webform:webform@postgres:5432/webform?sslmode=disable
      NATS_URL: nats://nats:4222
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  worker:
    build: .
    image: webform-builder:latest
    container_name: webform-worker
    command: ["./worker"]
    environment:
      DATABASE_URL: postgres://webform:webform@postgres:5432/webform?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: webform-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
